<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紫蘇飯糰 - 八仙六代園</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 450px;
      text-align: center;
    }
    
    /* 插圖展現 */
    .info-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px 16px 0 0;
    }

    /* 農家介紹卡片 */
    .farmer-card {
      background-color: #ffffff;
      padding: 24px;
      border-radius: 0 0 16px 16px;
      text-align: left;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    
    .farm-photo {
      width: 100%;
      height: auto;
      border-radius: 10px;
      margin-bottom: 16px;
      display: block;
    }

    .farmer-title {
      font-size: 20px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .farmer-desc {
      font-size: 14px;
      line-height: 1.7;
      color: #555555;
      margin-bottom: 20px;
    }

    /* 宣傳網站按鈕 */
    .website-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: #4a6b5d;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      font-size: 15px;
      transition: background-color 0.2s ease;
    }
    .website-btn:active {
      background-color: #385247;
    }

    /* 返回按鈕 */
    .back-btn {
      display: inline-block;
      margin-top: 25px;
      padding: 10px 24px;
      background-color: rgba(255,255,255,0.15);
      color: #ffffff;
      text-decoration: none;
      border-radius: 30px;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    .back-btn:active {
      background-color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 主插圖未命名26 -->
    <img class="info-img" src="未命名的作品 26.png" alt="紫蘇飯糰農家資訊" id="farmer-img">

    <!-- 八仙六代園 詳細卡片 -->
    <div class="farmer-card">
      <!-- 農家照片 -->
      <img class="farm-photo" src="八仙.jpg" alt="八仙六代園" id="farm-photo">
      
      <h2 class="farmer-title">🌾 八仙六代園</h2>
      <p class="farmer-desc">
        以陽明山的水為灌溉命脈，延續古法用灼灼烈日作為穀物烘乾機，採取友善環境的種植方式：不施化肥、100%無農藥使用，這樣的日曬米的米香有一種豐甜的味道叫「大自然」。
      </p>

      <!-- 宣傳網站按鈕 -->
      <a href="https://www.8gods.com.tw/zh-hant/categories/rice" target="_blank" class="website-btn">
        🌱 前往「八仙六代園」官網
      </a>
    </div>
    
    <!-- 返回便當主頁按鈕 -->
    <a href="index.html" class="back-btn">← 返回餐盒</a>
  </div>

  <script>
    // 檢查圖片載入
    document.getElementById('farmer-img').onerror = function() {
      console.error("找不到 未命名的作品 26.png");
    };
    document.getElementById('farm-photo').onerror = function() {
      alert("找不到圖片！請確認 GitHub 上是否有上傳『八仙.jpg』");
    };
  </script>

</body>
</html>
