<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紫蘇飯糰 - 農家介紹</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #fcfbfa;
      color: #333333;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #2c3e50;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #666666;
      margin-bottom: 24px;
    }
    .farmer-btn {
      display: inline-block;
      background-color: #4a6b5d;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s;
    }
    .farmer-btn:hover {
      background-color: #3b564a;
    }
    .back-link {
      display: block;
      margin-top: 20px;
      color: #888888;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🍙 紫蘇飯糰</h1>
    <p>嚴選在地無毒紫蘇葉與優質米種，帶來純粹自然的好滋味。</p>
    
    <!-- 未來可替換成實際農家網站連結 -->
    <a href="https://example.com" target="_blank" class="farmer-btn">前往農家網站 ➔</a>
  </div>

  <a href="index.html" class="back-link">← 返回餐盒</a>

</body>
</html>
