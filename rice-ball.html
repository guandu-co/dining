<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紫蘇飯糰 - 八仙六代園</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* 全螢幕大圖輪播區塊 */
    .hero-slider {
      position: relative;
      width: 100%;
      height: 100vh; /* 佔滿整頁螢幕高度 */
      overflow: hidden;
    }

    /* 輪播圖片定位與淡入淡出動畫 */
    .slide-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* 保持比例填滿全螢幕 */
      opacity: 0;
      transition: opacity 1.5s ease-in-out; /* 1.5秒淡入淡出 */
    }

    /* 顯示中的圖片 */
    .slide-img.active {
      opacity: 1;
    }

    /* 暗色漸層遮罩，讓下滑提示更清晰 */
    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2) 60%, rgba(18,18,18,1) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 30px;
      z-index: 2;
    }

    /* 往下滑動提示文字與箭頭 */
    .scroll-hint {
      font-size: 14px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.8);
      animation: bounce 2s infinite;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
      60% { transform: translateY(-4px); }
    }

    /* 往下滑動後顯示的農家資訊卡片區 */
    .content-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 20px 60px 20px;
      background-color: #121212;
    }

    .info-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px 16px 0 0;
    }

    .farmer-card {
      background-color: #1e1e1e;
      padding: 24px;
      border-radius: 0 0 16px 16px;
      text-align: left;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      border: 1px solid #2a2a2a;
      border-top: none;
    }

    .farmer-title {
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .farmer-desc {
      font-size: 14px;
      line-height: 1.8;
      color: #cccccc;
      margin-bottom: 24px;
    }

    /* 官網按鈕 */
    .website-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: #3b564a;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      font-size: 15px;
      transition: background-color 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .website-btn:active {
      background-color: #2d4239;
    }

    /* 返回按鈕 */
    .back-btn-container {
      text-align: center;
      margin-top: 30px;
    }
    .back-btn {
      display: inline-block;
      padding: 10px 24px;
      background-color: #2a2a2a;
      color: #ffffff;
      text-decoration: none;
      border-radius: 30px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- 1. 全螢幕淡入淡出圖片輪播區 -->
  <div class="hero-slider">
    <img class="slide-img active" src="八仙.jpg" alt="八仙六代園 景觀" id="img1">
    <img class="slide-img" src="米.jpg" alt="八仙六代園 日曬米" id="img2">
    
    <div class="hero-overlay">
      <div class="scroll-hint">往下滑動探索農家故事 ⬇️</div>
    </div>
  </div>

  <!-- 2. 下滑後呈現的文字卡片資訊 -->
  <div class="content-container">
    <img class="info-img" src="未命名的作品 26.png" alt="紫蘇飯糰農家資訊" id="farmer-img">

    <div class="farmer-card">
      <h2 class="farmer-title">🌾 八仙六代園</h2>
      <p class="farmer-desc">
        以陽明山的水為灌溉命脈，延續古法用灼灼烈日作為穀物烘乾機，採取友善環境的種植方式：不施化肥、100%無農藥使用，這樣的日曬米的米香有一種豐甜的味道叫「大自然」。
      </p>

      <a href="https://www.8gods.com.tw/zh-hant/categories/rice" target="_blank" class="website-btn">
        🌱 前往「八仙六代園」官網
      </a>
    </div>

    <div class="back-btn-container">
      <a href="index.html" class="back-btn">← 返回餐盒</a>
    </div>
  </div>

  <script>
    // 自動淡入淡出輪播 (每 3.5 秒切換一次)
    const slides = document.querySelectorAll('.slide-img');
    let currentSlide = 0;

    setInterval(() => {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }, 3500);

    // 除錯檢查
    document.getElementById('img1').onerror = function() { console.error("找不到 八仙.jpg"); };
    document.getElementById('img2').onerror = function() { console.error("找不到 米.jpg"); };
  </script>

</body>
</html>
