<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紫蘇飯糰 - 農家資訊</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 450px;
      text-align: center;
    }
    .info-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.5);
    }
    .back-btn {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 28px;
      background-color: #ffffff;
      color: #121212;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .back-btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 顯示農家資訊圖片 -->
    <img class="info-img" src="未命名的作品 26.png" alt="紫蘇飯糰農家資訊" id="farmer-img">
    
    <!-- 返回便當主頁按鈕 -->
    <a href="index.html" class="back-btn">← 返回餐盒</a>
  </div>

  <script>
    // 檢查圖片是否正確載入
    document.getElementById('farmer-img').onerror = function() {
      alert("找不到圖片！請確認 GitHub 上是否有上傳『未命名的作品 26.png』");
    };
  </script>

</body>
</html>
