<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餐食介紹 - 關渡共食</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-container {
      width: 100%;
      max-width: 450px;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頂部直排膠囊按鈕區 */
    .header-nav {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
    }

    .page-title-pill {
      width: 100%;
      background-color: #333333;
      color: #ffffff;
      padding: 12px 0;
      border-radius: 30px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      letter-spacing: 2px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .nav-pill {
      width: 100%;
      display: block;
      background-color: #afc136;
      color: #ffffff;
      padding: 14px 0;
      border-radius: 30px;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease, transform 0.1s ease;
      cursor: pointer;
      user-select: none;
      border: none;
      margin: 0;
    }
    .nav-pill:active {
      background-color: #9ab027;
      transform: scale(0.98);
    }

    /* 中間留白區塊 (點擊空白處可觸發八仙六代園小視窗) */
    .blank-shape-area {
      width: 100%;
      height: 140px;
      margin-bottom: 30px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px dashed #e0e0e0;
      border-radius: 16px;
      color: #aaaaaa;
      font-size: 14px;
      background-color: #fafafa;
    }

    /* 關渡平原微型藝術祭 Banner */
    .guandu-banner {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 25px;
      display: block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      background-color: #f5f5f5;
      min-height: 120px;
    }

    /* 底部直排膠囊按鈕區 */
    .footer-nav {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    /* 八仙六代園小視窗 (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 999;
      padding: 20px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: #0d6e5a;
      color: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      padding: 20px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .close-btn {
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      padding: 0 5px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .modal-media {
      width: 100%;
      height: 180px;
      position: relative;
      margin-bottom: 15px;
      border-radius: 10px;
      overflow: hidden;
      background-color: rgba(255,255,255,0.1);
    }
    .modal-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-desc {
      font-size: 13px;
      line-height: 1.6;
      color: #e2f3ee;
      margin-bottom: 15px;
      text-align: center;
    }

    .fb-btn {
      background-color: #ffffff;
      color: #0d6e5a;
      padding: 8px 30px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="page-container">
    
    <!-- 1. 上方 Header -->
    <div class="header-nav">
      <button class="nav-pill" id="btn-top">回上面</button>
      <div class="page-title-pill">餐食介紹</div>
    </div>

    <!-- 2. 中間純留白區域 (點擊彈出八仙六代園) -->
    <div class="blank-shape-area" id="rice-ball-trigger">
      點擊區域查看八仙六代園
    </div>

    <!-- 3. 關渡平原微型藝術祭 Banner (使用新檔名 guandu-banner.jpg) -->
    <img src="guandu-banner.jpg" alt="關渡平原微型藝術祭" class="guandu-banner">

    <!-- 4. 底部直排膠囊按鈕區 -->
    <div class="footer-nav">
      <a href="#" class="nav-pill">在地合作介紹</a>
      <a href="#" class="nav-pill">講師 / 藝術家介紹</a>
      <a href="https://usrhub.tnua.edu.tw/elementor-6431/#" class="nav-pill">回上頁</a>
    </div>

  </div>

  <!-- 5. 深綠色八仙六代園小視窗 -->
  <div class="modal-overlay" id="farm-modal">
    <div class="modal-card">
      
      <div class="modal-header">
        <span class="close-btn" id="close-modal">✕</span>
        <span class="modal-title">八仙六代園</span>
        <span style="width:20px;"></span>
      </div>

      <div class="modal-media">
        <img src="baxian.jpg" alt="八仙六代園" class="modal-img">
      </div>

      <p class="modal-desc">
        以陽明山的水為灌溉命脈，延續古法用灼灼烈日作為穀物烘乾機，採取友善環境不施化肥的種植方式。
      </p>

      <a href="https://www.8gods.com.tw/zh-hant/categories/rice" target="_blank" class="fb-btn">
        FB / 官網
