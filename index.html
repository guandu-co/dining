<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>關渡共食餐盒</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .hero-container {
      width: 90%;
      max-width: 450px;
      text-align: center;
      cursor: pointer;
    }
    .hero-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: transform 0.2s ease;
    }
    .hero-container img:active {
      transform: scale(0.98);
    }
    .hint-text {
      margin-top: 15px;
      font-size: 14px;
      color: #bbbbbb;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="hero-container" id="bento-box">
    <!-- 預設顯示 3.gif -->
    <img id="main-img" src="3.gif" alt="關渡共食餐盒">
    <p class="hint-text" id="hint">👆 點擊餐盒開吃！</p>
  </div>

  <script>
    const bentoBox = document.getElementById('bento-box');
    const mainImg = document.getElementById('main-img');
    const hint = document.getElementById('hint');

    // 狀態紀錄: 0 = 3.gif, 1 = 不動.png, 2 = 飯糰.png
    let currentState = 0;

    bentoBox.addEventListener('click', () => {
      if (currentState === 0) {
        // 第一次點擊：切換為靜態完整圖 (不動.png)
        mainImg.src = '不動.png';
        hint.innerText = '👆 再次點擊餐盒，查看「紫蘇飯糰」！';
        currentState = 1;
      } else if (currentState === 1) {
        // 第二次點擊：切換為飯糰高亮圖 (飯糰.png)
        mainImg.src = '飯糰.png';
        hint.innerText = '🍙 紫蘇飯糰：來自在地農家耕作';
        currentState = 2;
      } else if (currentState === 2) {
        // 第三次點擊：切換回全亮靜態圖 (不動.png)
        mainImg.src = '不動.png';
        hint.innerText = '👆 點擊餐盒選擇菜色';
        currentState = 1;
      }
    });

    // 圖片載入除錯提示
    mainImg.onerror = function() {
      console.error("圖片載入失敗，請確認檔名：", mainImg.src);
      alert("找不到圖片！請確認 GitHub 上的圖檔名稱是否真的為：" + mainImg.src.split('/').pop());
    };
  </script>

</body>
</html>
