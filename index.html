<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>關渡共食餐盒</title>
  <style>
    /* 頁面基本設定：全螢幕居中與簡約背景 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #fcfbfa; /* 溫暖柔和的底色 */
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .hero-container {
      width: 90%;
      max-width: 500px; /* 手機與桌機都適合的寬度 */
      text-align: center;
    }

    /* 圖片與影片填滿容器 */
    .hero-container img, .hero-container video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <img id="intro-gif" src="3.gif" alt="餐盒登場動畫">
  </div>

  <script>
    // 取得圖片元件
    const gifImage = document.getElementById('intro-gif');
    
    // 設定動畫時間（請依您的 GIF 播放長度調整毫秒數，例如 3 秒 = 3000）
    const animationDuration = 3000; 

    // 當頁面載入後，定時在動畫播完時將圖片換成靜態凍結畫面（或停止）
    window.addEventListener('load', () => {
      setTimeout(() => {
        // 動畫播完後的處理（例如可加上淡出或跳轉）
        console.log("動畫播放完畢");
      }, animationDuration);
    });
  </script>

</body>
</html>
