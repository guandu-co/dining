<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>關渡共食餐盒</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .hero-container {
      width: 90%;
      max-width: 450px;
      text-align: center;
      position: relative;
      cursor: pointer;
    }
    .hero-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .hint-text {
      margin-top: 15px;
      font-size: 14px;
      color: #bbbbbb;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="hero-container" id="bento-box">
    <!-- 預設顯示 3.gif -->
    <img id="main-img" src="3.gif" alt="關渡共食餐盒">
    <p class="hint-text" id="hint">👆 點擊餐盒開吃！</p>
  </div>

  <script>
    const bentoBox = document.getElementById('bento-box');
    const mainImg = document.getElementById('main-img');
    const hint = document.getElementById('hint');

    let isStarted = false; // 是否已從 GIF 切換成靜態圖

    bentoBox.addEventListener('click', (e) => {
      // 第一次點擊：從 GIF 切換成 不動.png
      if (!isStarted) {
        mainImg.src = '不動.png';
        hint.innerText = '👆 點擊「紫蘇飯糰」或「玉子燒」查看食材資訊！';
        isStarted = true;
        return;
      }

      // 取得點擊在圖片上的相對位置 (百分比)
      const rect = mainImg.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) / rect.width;  // X 軸 0 ~ 1 (左到右)
      const clickY = (e.clientY - rect.top) / rect.height;  // Y 軸 0 ~ 1 (上到下)

      // 判定 1：點擊右下角區塊 (玉子燒區域)
      if (clickX > 0.4 && clickY > 0.6) {
        mainImg.src = '玉子燒亮.png';
        hint.innerText = '🍳 玉子燒：選用優質放牧雞蛋';
      } 
      // 判定 2：點擊右上角區塊 (飯糰區域)
      else if (clickX > 0.4 && clickY <= 0.6) {
        mainImg.src = '飯糰.png';
        hint.innerText = '🍙 紫蘇飯糰：來自在地農家耕作';
      } 
      // 點擊其他地方：切換回全亮
      else {
        mainImg.src = '不動.png';
        hint.innerText = '👆 點擊菜色查看農家資訊';
      }
    });

    // 圖片載入失敗檢查
    mainImg.onerror = function() {
      alert("找不到圖片！請確認 GitHub 上的圖檔名稱是否為：" + mainImg.src.split('/').pop());
    };
  </script>

</body>
</html>
