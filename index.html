<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餐食介紹 - 關渡共食</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頁面整體容器 */
    .page-container {
      width: 100%;
      max-width: 450px;
      padding: 20px 15px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 上方標頭與按鈕直向排列區域 */
    .header-nav {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    /* 頁面大標題膠囊 */
    .page-title-pill {
      width: 100%;
      background-color: #333333;
      color: #ffffff;
      padding: 12px 0;
      border-radius: 30px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      letter-spacing: 2px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* 通用草綠色膠囊按鈕 (直向滿版) */
    .nav-pill {
      width: 100%;
      background-color: #afc136;
      color: #ffffff;
      padding: 14px 0;
      border-radius: 30px;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease, transform 0.1s ease;
      cursor: pointer;
      user-select: none;
      display: block;
    }
    .nav-pill:active {
      background-color: #9ab027;
      transform: scale(0.98);
    }

    /* 幾何食材區域 */
    .shapes-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      margin-bottom: 40px;
    }
    .shape-item {
      cursor: pointer;
      transition: transform 0.2s ease;
      max-width: 80%;
      height: auto;
    }
    .shape-item:active {
      transform: scale(0.95);
    }

    /* 關渡平原藝術祭 Banner */
    .guandu-banner {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 25px;
      display: block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      background-color: #f0f0f0;
      min-height: 120px;
    }
