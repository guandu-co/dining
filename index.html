<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餐食介紹 - 關渡共食</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-container {
      width: 100%;
      max-width: 450px;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頂部 Header */
    .header-section {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 25px;
      margin-bottom: 25px;
      padding-left: 10px;
    }

    .btn-back-top {
      background-color: #b3c200;
      color: #ffffff;
      width: 65px;
      height: 120px;
      border-radius: 35px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 20px;
      writing-mode: vertical-lr;
      letter-spacing: 4px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.1s ease, background-color 0.2s ease;
      border: none;
      text-decoration: none;
    }
    .btn-back-top:active {
      transform: scale(0.95);
      background-color: #9ea800;
    }

    .header-title {
      font-size: 32px;
      font-weight: bold;
      color: #2b2b2b;
      letter-spacing: 2px;
    }

    /* 食材圖形網格區域 */
    .food-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 35px;
      padding: 0 5px;
    }

    .food-row {
      width: 100%;
      display: flex;
      align-items: center;
    }

    .food-row.row-left {
      justify-content: flex-start;
      padding-left: 5px;
    }

    .food-row.row-right {
      justify-content: flex-end;
      padding-right: 5px;
    }

    .food-row.row-center {
      justify-content: center;
    }

    /* -----------------------------------
       食材 + 標籤組合通用樣式與漂浮
    ----------------------------------- */
    .food-group {
      display: flex;
      align-items: center;
      cursor: pointer;
      will-change: transform;
      animation: floatAnim 3s ease-in-out infinite alternate;
      transition: transform 0.15s ease-out;
    }

    .food-group:active {
      transform: scale(1.1) !important;
    }

    .labels-column {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 右側標籤專用 Margin */
    .labels-right {
      margin-left: -8px;
    }

    /* 左側標籤專用 Margin */
    .labels-left {
      margin-right: -8px;
    }

    .label-line-item {
      display: flex;
      align-items: center;
    }

    .pointer-line {
      width: 25px;
      height: 2px;
      background-color: #e5cd00;
      display: inline-block;
      margin: 0 4px;
    }

    .riceball-label-yellow {
      font-size: 14px;
      font-weight: bold;
      color: #e5cd00;
      letter-spacing: 0.5px;
      user-select: none;
      white-space: nowrap;
    }

    .food-item {
      max-width: 120px;
      height: auto;
      cursor: pointer;
      display: block;
    }

    @keyframes floatAnim {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }

    .delay-1 { animation-delay: 0s; }
    .delay-2 { animation-delay: 0.5s; }
    .delay-3 { animation-delay: 1.0s; }
    .delay-4 { animation-delay: 1.5s; }
    .delay-5 { animation-delay: 2.0s; }
    .delay-6 { animation-delay: 2.5s; }

    /* 關渡平原 Banner */
    .guandu-banner {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 25px;
      display: block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      background-color: #f5f5f5;
      min-height: 120px;
    }

    /* 底部橫向並排直立膠囊按鈕區 */
    .footer-nav-horizontal {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .nav-pill-vertical {
      flex: 1;
      height: 190px;
      background-color: #b3c200;
      color: #ffffff;
      border-radius: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 17px;
      writing-mode: vertical-lr;
      letter-spacing: 3px;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      transition: background-color 0.2s ease, transform 0.1s ease;
      cursor: pointer;
      user-select: none;
      border: none;
    }

    .nav-pill-vertical:active {
      background-color: #9ea800;
      transform: scale(0.95);
    }

    /* -----------------------------------
       八仙 / 湖山 社區彈跳視窗 (Modal)
    ----------------------------------- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 999;
      padding: 20px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: #0d6e5a;
      color: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      padding: 20px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .close-btn {
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      padding: 0 5px;
      line-height: 1;
    }

    .modal-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      text-align: center;
      flex-grow: 1;
    }

    .modal-media {
      width: 100%;
      height: 180px;
      position: relative;
      margin-bottom: 12px;
      border-radius: 12px;
      overflow: hidden;
      background-color: rgba(255,255,255,0.1);
    }
    .modal-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }
    .modal-img.active {
      opacity: 1;
    }

    .arrow-left, .arrow-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 22px;
      color: #ffffff;
      cursor: pointer;
      background: rgba(0,0,0,0.35);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      user-select: none;
    }
    .arrow-left { left: 8px; }
    .arrow-right { right: 8px; }

    /* 切換農場卡片的大白色箭頭 */
    .card-switch-arrow {
      position: absolute;
      top: 65%;
      transform: translateY(-50%);
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      z-index: 20;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .card-switch-arrow:active {
      background: rgba(255, 255, 255, 0.5);
      transform: translateY(-50%) scale(0.9);
    }
    .card-switch-arrow.left-arrow { left: -12px; }
    .card-switch-arrow.right-arrow { right: -12px; }

    /* 「飯糰中的：米 / 豆腐乳」提示列 */
    .ingredient-tag {
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ingredient-highlight {
      border: 2px solid #b3c200;
      color: #ffffff;
      padding: 2px 10px;
      border-radius: 8px;
      background-color: rgba(179, 194, 0, 0.2);
    }

    .modal-desc {
      font-size: 12.5px;
      line-height: 1.5;
      color: #e2f3ee;
      margin-bottom: 15px;
      text-align: left;
      min-height: 60px;
      padding: 0 5px;
    }

    .fb-btn {
      background-color: #ffffff;
      color: #0d6e5a;
      padding: 8px 30px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <div class="page-container">
    
    <!-- 1. 頂部 Header -->
    <div class="header-section">
      <a href="https://usrhub.tnua.edu.tw/elementor-6431/#" class="btn-back-top">回上面</a>
      <h1 class="header-title">餐食介紹</h1>
    </div>

    <!-- 2. 食材圖形區域 (6個圖案皆配對應方向的黃色標籤與引線) -->
    <div class="food-grid">
      
      <!-- 第一排：riceball1 (文字在右側) -->
      <div class="food-row row-left">
        <div class="food-group delay-1 trigger-farm-modal">
          <img src="riceball1.png" alt="riceball1" class="food-item">
          <div class="labels-column labels-right">
            <div class="label-line-item">
              <span class="pointer-line"></span>
              <span class="riceball-label-yellow">八仙六代園</span>
            </div>
            <div class="label-line-item">
              <span class="pointer-line"></span>
              <span class="riceball-label-yellow">湖山社區發展協會</span>
            </div>
          </div>
        </div>
      </div>

      <!-- chicken (文字在左側) -->
      <div class="food-row row-right" style="margin-top: -30px;">
        <div class="food-group delay-2">
          <div class="labels-column labels-left">
            <div class="label-line-item">
              <span class="riceball-label-yellow">峰村有機農場</span>
              <span class="pointer-line"></span>
            </div>
          </div>
          <img src="chicken.png" alt="chicken" class="food-item">
        </div>
      </div>

      <!-- vege (文字在右側，多行) -->
      <div class="food-row row-left" style="margin-top: -10px;">
        <div class="food-group delay-3">
          <img src="vege.png" alt="vege" class="food-item" style="max-width: 125px;">
          <div class="labels-column labels-right">
            <div class="label-line-item"><span class="pointer-line"></span><span class="riceball-label-yellow">一德農園</span></div>
            <div class="label-line-item"><span class="pointer-line"></span><span class="riceball-label-yellow">四口田</span></div>
            <div class="label-line-item"><span class="pointer-line"></span><span class="riceball-label-yellow">故鄉金針花農園</span></div>
            <div class="label-line-item"><span class="pointer-line"></span><span class="riceball-label-yellow">峰村有機農場</span></div>
            <div class="label-line-item"><span class="pointer-line"></span><span class="riceball-label-yellow">山水香-曹永慶</span></div>
            <div class="label-line-item"><span class="pointer-line"></span><span class="riceball-label-yellow">湖山社區發展協會</span></div>
          </div>
        </div>
      </div>

      <!-- riceball2 (文字在左側) -->
      <div class="food-row row-right" style="margin-top: -20px;">
        <div class="food-group delay-4 trigger-farm-modal">
          <div class="labels-column labels-left">
            <div class="label-line-item"><span class="riceball-label-yellow">八仙六代園</span><span class="pointer-line"></span></div>
            <div class="label-line-item"><span class="riceball-label-yellow">四口田</span><span class="pointer-line"></span></div>
            <div class="label-line-item"><span class="riceball-label-yellow">峰村有機農場</span><span class="pointer-line"></span></div>
          </div>
          <img src="riceball2.png" alt="riceball2" class="food-item">
        </div>
      </div>

      <!-- eggroll (文字在右側) -->
      <div class="food-row row-left" style="margin-top: -15px;">
        <div class="food-group delay-5">
          <img src="eggroll.png" alt="eggroll" class="food-item" style="max-width: 130px;">
          <div class="labels-column labels-right">
            <div class="label-line-item"><span class="pointer-line"></span><span class="riceball-label-yellow">足妹農場</span></div>
            <div class="label-line-item"><span class="pointer-line"></span><span class="riceball-label-yellow">隨野家農場</span></div>
          </div>
        </div>
      </div>

      <!-- cake (文字在左側) -->
      <div class="food-row row-center" style="margin-top: 10px;">
        <div class="food-group delay-6">
          <div class="labels-column labels-left">
            <div class="label-line-item"><span class="riceball-label-yellow">八仙六代園</span><span class="pointer-line"></span></div>
            <div class="label-line-item"><span class="riceball-label-yellow">財福海芋田</span><span class="pointer-line"></span></div>
            <div class="label-line-item"><span class="riceball-label-yellow">峰村有機農場</span><span class="pointer-line"></span></div>
            <div class="label-line-item"><span class="riceball-label-yellow">一德農園</span><span class="pointer-line"></span></div>
          </div>
          <img src="cake.png" alt="cake" class="food-item" style="max-width: 135px;">
        </div>
      </div>

    </div>

    <!-- 3. 關渡平原微型藝術祭 Banner -->
    <img src="guandu-banner.jpg" alt="關渡平原微型藝術祭" class="guandu-banner">

    <!-- 4. 底部三個豎長型直排膠囊按鈕 -->
    <div class="footer-nav-horizontal">
      <a href="#" class="nav-pill-vertical">在地合作介紹</a>
      <a href="#" class="nav-pill-vertical">講師/藝術家介紹</a>
      <a href="https://usrhub.tnua.edu.tw/elementor-6431/#" class="nav-pill-vertical">回上頁</a>
    </div>

  </div>

  <!-- 5. 八仙六代園 ↔ 湖山社區發展協會 彈跳視窗 -->
  <div class="modal-overlay" id="farm-modal">
    <div class="modal-card">
      
      <span class="card-switch-arrow left-arrow" id="card-prev">‹</span>
      <span class="card-switch-arrow right-arrow" id="card-next">›</span>

      <div class="modal-header">
        <span class="close-btn" id="close-modal">✕</span>
        <span class="modal-title" id="modal-card-title">八仙六代園</span>
        <span style="width:20px;"></span>
      </div>

      <div class="modal-media" id="media-container">
        <span class="arrow-left" id="prev-img">‹</span>
        <span class="arrow-right" id="next-img">›</span>
      </div>

      <div class="ingredient-tag">
        飯糰中的：<span class="ingredient-highlight" id="ingredient-text">米</span>
      </div>

      <p class="modal-desc" id="modal-desc-text">
        農家第六代---宣智與亦真堅持友善耕作與自然共生，致力為下一代留下無毒乾淨的土地。<br><br>農場積極推動食農教育與季節農事體驗，包含插秧、割稻及米食 DIY、稻田運動會。邀請民眾在金黃稻浪間親近土地，感受都市角落裡最真誠的農村風土。
      </p>

      <a href="https://www.facebook.com/beitoubaxianfarm" target="_blank" class="fb-btn" id="modal-fb-link">
        FB
      </a>

    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var cardsData = [
        {
          title: "八仙六代園",
          ingredient: "米",
          desc: "農家第六代---宣智與亦真堅持友善耕作與自然共生，致力為下一代留下無毒乾淨的土地。<br><br>農場積極推動食農教育與季節農事體驗，包含插秧、割稻及米食 DIY、稻田運動會。邀請民眾在金黃稻浪間親近土地，感受都市角落裡最真誠的農村風土。",
          fb: "https://www.facebook.com/beitoubaxianfarm",
          imgs: ["rice.webp", "eightpeople.jpg", "riceplant.webp", "carrot.jpg"]
        },
        {
          title: "湖山社區發展協會",
          ingredient: "豆腐乳",
          desc: "位於陽明山湖山里，致力於推廣在地友善農作與傳統醬菜手工藝，傳承在地豐富的人文與飲食文化。",
          fb: "https://www.facebook.com/hushantw",
          imgs: ["hu1.jpg", "hu2.jpg", "hu3.jpg", "hu4.jpg", "hu5.jpg"]
        }
      ];

      var currentCardIdx = 0;
      var currentImgIdx = 0;
      var autoPlayTimer = null;

      var farmModal = document.getElementById('farm-modal');
      var closeModal = document.getElementById('close-modal');
      var cardTitle = document.getElementById('modal-card-title');
      var ingredientText = document.getElementById('ingredient-text');
      var descText = document.getElementById('modal-desc-text');
      var fbLink = document.getElementById('modal-fb-link');
      var mediaContainer = document.getElementById('media-container');

      function loadCard(cardIdx) {
        currentCardIdx = cardIdx;
        currentImgIdx = 0;
        var data = cardsData[cardIdx];

        cardTitle.innerText = data.title;
        ingredientText.innerText = data.ingredient;
        descText.innerHTML = data.desc;
        fbLink.href = data.fb;

        var oldImgs = mediaContainer.querySelectorAll('.modal-img');
        oldImgs.forEach(function(img) { img.remove(); });

        data.imgs.forEach(function(src, i) {
          var imgEl = document.createElement('img');
          imgEl.src = src;
          imgEl.className = 'modal-img' + (i === 0 ? ' active' : '');
          mediaContainer.appendChild(imgEl);
        });
      }

      function showSlide(imgIdx) {
        var imgs = mediaContainer.querySelectorAll('.modal-img');
        imgs.forEach(function(img, i) {
          if (i === imgIdx) img.classList.add('active');
          else img.classList.remove('active');
        });
      }

      function startAutoPlay() {
        if (autoPlayTimer) clearInterval(autoPlayTimer);
        autoPlayTimer = setInterval(function() {
          var imgs = mediaContainer.querySelectorAll('.modal-img');
          if (imgs.length > 0) {
            currentImgIdx = (currentImgIdx + 1) % imgs.length;
            showSlide(currentImgIdx);
          }
        }, 3000);
      }

      function stopAutoPlay() {
        if (autoPlayTimer) clearInterval(autoPlayTimer);
      }

      var triggers = document.querySelectorAll('.trigger-farm-modal');
      triggers.forEach(function(trigger) {
        trigger.addEventListener('click', function() {
          if (farmModal) {
            loadCard(0);
            farmModal.classList.add('active');
            startAutoPlay();
          }
        });
      });

      document.getElementById('card-prev').addEventListener('click', function() {
        stopAutoPlay();
        currentCardIdx = (currentCardIdx - 1 + cardsData.length) % cardsData.length;
        loadCard(currentCardIdx);
        startAutoPlay();
      });

      document.getElementById('card-next').addEventListener('click', function() {
        stopAutoPlay();
        currentCardIdx = (currentCardIdx + 1) % cardsData.length;
        loadCard(currentCardIdx);
        startAutoPlay();
      });

      document.getElementById('next-img').addEventListener('click', function() {
        stopAutoPlay();
        var imgs = mediaContainer.querySelectorAll('.modal-img');
        currentImgIdx = (currentImgIdx + 1) % imgs.length;
        showSlide(currentImgIdx);
        startAutoPlay();
      });

      document.getElementById('prev-img').addEventListener('click', function() {
        stopAutoPlay();
        var imgs = mediaContainer.querySelectorAll('.modal-img');
        currentImgIdx = (currentImgIdx - 1 + imgs.length) % imgs.length;
        showSlide(currentImgIdx);
        startAutoPlay();
      });

      if (closeModal && farmModal) {
        closeModal.addEventListener('click', function() {
          farmModal.classList.remove('active');
          stopAutoPlay();
        });
      }

      if (farmModal) {
        farmModal.addEventListener('click', function(e) {
          if (e.target === farmModal) {
            farmModal.classList.remove('active');
            stopAutoPlay();
          }
        });
      }
    });
  </script>

</body>
</html>
