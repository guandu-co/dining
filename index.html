<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>關渡共食餐盒</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .hero-container {
      width: 90%;
      max-width: 450px;
      text-align: center;
      cursor: pointer;
    }
    .hero-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .hint-text {
      margin-top: 15px;
      font-size: 14px;
      color: #bbbbbb;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="hero-container" id="bento-box">
    <img id="main-img" src="3.gif" alt="關渡共食餐盒">
    <p class="hint-text" id="hint">👆 點擊餐盒開吃！</p>
  </div>

  <script>
    const bentoBox = document.getElementById('bento-box');
    const mainImg = document.getElementById('main-img');
    const hint = document.getElementById('hint');

    // 基礎切換：從 GIF 變靜態圖
    bentoBox.addEventListener('click', () => {
      mainImg.src = '不動.png';
      hint.innerText = '🍱 關渡共食餐盒';
    });
  </script>

</body>
</html>
