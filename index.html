<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餐食介紹 - 關渡共食</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-container {
      width: 100%;
      max-width: 450px;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頂部 Header */
    .header-section {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 25px;
      margin-bottom: 25px;
      padding-left: 10px;
    }

    .btn-back-top {
      background-color: #b3c200;
      color: #ffffff;
      width: 65px;
      height: 120px;
      border-radius: 35px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 20px;
      writing-mode: vertical-lr;
      letter-spacing: 4px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.1s ease, background-color 0.2s ease;
      border: none;
    }
    .btn-back-top:active {
      transform: scale(0.95);
      background-color: #9ea800;
    }

    .header-title {
      font-size: 32px;
      font-weight: bold;
      color: #2b2b2b;
      letter-spacing: 2px;
    }

    /* 食材圖形網格區域 */
    .food-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 35px;
      padding: 0 10px;
    }

    .food-row {
      width: 100%;
      display: flex;
      align-items: center;
    }

    .food-row.row-left {
      justify-content: flex-start;
      padding-left: 20px;
    }

    .food-row.row-right {
      justify-content: flex-end;
      padding-right: 20px;
    }

    .food-row.row-center {
      justify-content: center;
    }

    /* -----------------------------------
       動態漂浮與點擊放大效果 (Floating Animation)
    ----------------------------------- */
    .food-item {
      max-width: 130px;
      height: auto;
      cursor: pointer;
      display: block;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: floatMotion 3.5s ease-in-out infinite alternate;
    }

    /* 點擊時稍微放大 */
    .food-item:active {
      transform: scale(1.15) !important;
    }

    /* 微幅漂浮動畫軌跡 */
    @keyframes floatMotion {
      0% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-8px) rotate(1.5deg);
      }
      100% {
        transform: translateY(-15px) rotate(-1.5deg);
      }
    }

    /* 各個圖片設定不同動畫延遲，產生錯落漂浮感 */
    .float-delay-1 { animation-delay: 0s; }
    .float-delay-2 { animation-delay: 0.6s; }
    .float-delay-3 { animation-delay: 1.2s; }
    .float-delay-4 { animation-delay: 1.8s; }
    .float-delay-5 { animation-delay: 2.4s; }
    .float-delay-6 { animation-delay: 3.0s; }

    /* 關渡平原微型藝術祭 Banner */
    .guandu-banner {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 25px;
      display: block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      background-color: #f5f5f5;
      min-height: 120px;
    }

    /* 底部直排膠囊按鈕區 */
    .footer-nav {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

      width: 100%;
      display: block;
      background-color: #b3c200;
      color: #ffffff;
      padding: 14px 0;
      border-radius: 30px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: background-color 0.
