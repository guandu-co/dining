<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餐食介紹 - 關渡共食</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頁面整體容器 */
    .page-container {
      width: 100%;
      max-width: 450px;
      padding: 20px 15px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 上方「回上面 / 餐食介紹」標頭 */
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .back-top-pill {
      background-color: #afc136;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .page-title {
      font-size: 22px;
      font-weight: bold;
      color: #333333;
      letter-spacing: 2px;
    }

    /* 幾何食材區域 */
    .shapes-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      margin-bottom: 40px;
    }
    .shape-item {
      cursor: pointer;
      transition: transform 0.2s ease;
      max-width: 80%;
    }
    .shape-item:active {
      transform: scale(0.95);
    }

    /* 關渡平原藝術祭 Banner (按鈕正上方圖片) */
    .guandu-banner {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 25px;
      display: block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    /* 底部直排膠囊按鈕區 */
    .footer-nav {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
    }
    .nav-pill {
      width: 100%;
      background-color: #afc136;
      color: #ffffff;
      padding: 14px 0;
      border-radius: 30px;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
    }
    .nav-pill:active {
      background-color: #9ab027;
    }

      display: flex;
