<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餐食介紹 - 關渡共食</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-container {
      width: 100%;
      max-width: 450px;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頂部 Header */
    .header-section {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 25px;
      margin-bottom: 25px;
      padding-left: 10px;
    }

    .btn-back-top {
      background-color: #b3c200;
      color: #ffffff;
      width: 65px;
      height: 120px;
      border-radius: 35px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 20px;
      writing-mode: vertical-lr;
      letter-spacing: 4px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.1s ease, background-color 0.2s ease;
      border: none;
      text-decoration: none;
    }
    .btn-back-top:active {
      transform: scale(0.95);
      background-color: #9ea800;
    }

    .header-title {
      font-size: 32px;
      font-weight: bold;
      color: #2b2b2b;
      letter-spacing: 2px;
    }

    /* 食材圖形網格區域 */
    .food-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 35px;
      padding: 0 10px;
    }

    .food-row {
      width: 100%;
      display: flex;
      align-items: center;
    }

    .food-row.row-left {
      justify-content: flex-start;
      padding-left: 20px;
    }

    .food-row.row-right {
      justify-content: flex-end;
      padding-right: 20px;
    }

    .food-row.row-center {
      justify-content: center;
    }

    /* 漂浮與點擊放大效果 */
    .food-item {
      max-width: 130px;
      height: auto;
      cursor: pointer;
      display: block;
      will-change: transform;
      animation: floatAnim 3s ease-in-out infinite alternate;
      transition: transform 0.15s ease-out;
    }

    .food-item:active {
      transform: scale(1.18) !important;
    }

    @keyframes floatAnim {
      0% {
        transform: translateY(0px);
      }
      100% {
        transform: translateY(-12px);
      }
    }

    .delay-1 { animation-delay: 0s; }
    .delay-2 { animation-delay: 0.5s; }
    .delay-3 { animation-delay: 1.0s; }
    .delay-4 { animation-delay: 1.5s; }
    .delay-5 { animation-delay: 2.0s; }
    .delay-6 { animation-delay: 2.5s; }

    /* 關渡平原 Banner */
    .guandu-banner {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 25px;
      display: block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      background-color: #f5f5f5;
      min-height: 120px;
    }

    /* 底部橫向並排直立膠囊按鈕區 */
    .footer-nav-horizontal {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .nav-pill-vertical {
      flex: 1;
      height: 190px;
      background-color: #b3c200;
      color: #ffffff;
      border-radius: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 17px;
      writing-mode: vertical-lr;
      letter-spacing: 3px;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      transition: background-color 0.2s ease, transform 0.1s ease;
      cursor: pointer;
      user-select: none;
      border: none;
    }

    .nav-pill-vertical:active {
      background-color: #9ea800;
      transform: scale(0.95);
    }

    /* 八仙六代園小視窗 (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 999;
      padding: 20px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: #0d6e5a;
      color: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      padding: 20px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .close-btn {
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      padding: 0 5px;
      line-height: 1;
    }
    .modal-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .modal-media {
      width: 100%;
      height: 190px;
      position: relative;
      margin-bottom: 15px;
      border-radius: 12px;
      overflow: hidden;
      background-color: rgba(255,255,255,0.1);
    }
    .modal-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }
    .modal-img.active {
      opacity: 1;
    }

    .arrow-left, .arrow-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 22px;
      color: #ffffff;
      cursor: pointer;
      background: rgba(0,0,0,0.35);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      user-select: none;
    }
    .arrow-left { left: 8px; }
    .arrow-right { right: 8px; }

    .modal-desc {
      font-size: 13px;
      line-height: 1.6;
      color: #e2f3ee;
      margin-bottom: 15px;
      text-align: center;
    }

    .fb-btn {
      background-color: #ffffff;
      color: #0d6e5a;
      padding: 8px 30px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <div class="page-container">
    
    <!-- 1. 頂部 Header (點擊導至外部網站) -->
    <div class="header-section">
      <a href="https://usrhub.tnua.edu.tw/elementor-6431/#" class="btn-back-top">回上面</a>
      <h1 class="header-title">餐食介紹</h1>
    </div>

    <!-- 2. 食材圖形區域 -->
    <div class="food-grid">
      
      <div class="food-row row-left">
        <img src="riceball1.png" alt="riceball1" class="food-item delay-1 trigger-farm-modal">
      </div>
      <div class="food-row row-right" style="margin-top: -40px;">
        <img src="chicken.png" alt="chicken" class="food-item delay-2">
      </div>

      <div class="food-row row-left" style="margin-top: -10px; padding-left: 50px;">
        <img src="vege.png" alt="vege" class="food-item delay-3" style="max-width: 140px;">
      </div>
      <div class="food-row row-right" style="margin-top: -30px;">
        <img src="riceball2.png" alt="riceball2" class="food-item delay-4 trigger-farm-modal">
      </div>

      <div class="food-row row-left" style="margin-top: -20px;">
        <img src="eggroll.png" alt="eggroll" class="food-item delay-5" style="max-width: 150px;">
      </div>

      <div class="food-row row-center" style="margin-top: 10px;">
        <img src="cake.png" alt="cake" class="food-item delay-6" style="max-width: 160px;">
      </div>

    </div>

    <!-- 3. 關渡平原微型藝術祭 Banner -->
    <img src="guandu-banner.jpg" alt="關渡平原微型藝術祭" class="guandu-banner">

    <!-- 4. 底部三個豎長型直排膠囊按鈕 -->
    <div class="footer-nav-horizontal">
      <a href="#" class="nav-pill-vertical">在地合作介紹</a>
      <a href="#" class="nav-pill-vertical">講師/藝術家介紹</a>
      <a href="https://usrhub.tnua.edu.tw/elementor-6431/#" class="nav-pill-vertical">回上頁</a>
    </div>

  </div>

  <!-- 5. 八仙六代園小視窗 -->
  <div class="modal-overlay" id="farm-modal">
    <div class="modal-card">
      
      <div class="modal-header">
        <span class="close-btn" id="close-modal">✕</span>
        <span class="modal-title">八仙六代園</span>
        <span style="width:20px;"></span>
      </div>

      <div class="modal-media">
        <span class="arrow-left" id="prev-img">‹</span>
        <img src="rice.webp" alt="八仙六代園 白米" class="modal-img active">
        <img src="eightpeople.jpg" alt="八仙六代園 人物" class="modal-img">
        <img src="riceplant.webp" alt="八仙六代園 稻田" class="modal-img">
        <img src="carrot.jpg" alt="八仙六代園 蘿蔔" class="modal-img">
        <span class="arrow-right" id="next-img">›</span>
      </div>

      <p class="modal-desc">
        以陽明山的水為灌溉命脈，延續古法用灼灼烈日作為穀物烘乾機，採取友善環境不施化肥的種植方式。
      </p>

      <a href="https://www.facebook.com/beitoubaxianfarm" target="_blank" class="fb-btn">
        FB
      </a>

    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var triggers = document.querySelectorAll('.trigger-farm-modal');
      var farmModal = document.getElementById('farm-modal');
      var closeModal = document.getElementById('close-modal');
      var modalImgs = document.querySelectorAll('.modal-img');
      var currentIdx = 0;
      var autoPlayTimer = null;

      function showSlide(index) {
        for (var i = 0; i < modalImgs.length; i++) {
          if (i === index) {
            modalImgs[i].classList.add('active');
          } else {
            modalImgs[i].classList.remove('active');
          }
        }
      }

      function startAutoPlay() {
        if (autoPlayTimer) clearInterval(autoPlayTimer);
        autoPlayTimer = setInterval(function() {
          currentIdx = (currentIdx + 1) % modalImgs.length;
          showSlide(currentIdx);
        }, 3000);
      }

      function stopAutoPlay() {
        if (autoPlayTimer) clearInterval(autoPlayTimer);
      }

      for (var j = 0; j < triggers.length; j++) {
        triggers[j].addEventListener('click', function() {
          if (farmModal) {
            farmModal.classList.add('active');
            startAutoPlay();
          }
        });
      }

      if (closeModal && farmModal) {
        closeModal.addEventListener('click', function() {
          farmModal.classList.remove('active');
          stopAutoPlay();
        });
      }

      if (farmModal) {
        farmModal.addEventListener('click', function(e) {
          if (e.target === farmModal) {
            farmModal.classList.remove('active');
            stopAutoPlay();
          }
        });
      }

      var nextBtn = document.getElementById('next-img');
      var prevBtn = document.getElementById('prev-img');

      if (nextBtn) {
        nextBtn.addEventListener('click', function() {
          stopAutoPlay();
          currentIdx = (currentIdx + 1) % modalImgs.length;
          showSlide(currentIdx);
          startAutoPlay();
        });
      }

      if (prevBtn) {
        prevBtn.addEventListener('click', function() {
          stopAutoPlay();
          currentIdx = (currentIdx - 1 + modalImgs.length) % modalImgs.length;
          showSlide(currentIdx);
          startAutoPlay();
        });
      }
    });
  </script>

</body>
</html>
