<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餐食介紹 - 關渡共食</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-container {
      width: 100%;
      max-width: 450px;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頂部 Header：左側直排膠囊 + 右側標題 */
    .header-section {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 25px;
      margin-bottom: 25px;
      padding-left: 10px;
    }

    /* 左側直向「回上面」黃綠色膠囊按鈕 */
    .btn-back-top {
      background-color: #b3c200;
      color: #ffffff;
      width: 65px;
      height: 120px;
      border-radius: 35px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 20px;
      writing-mode: vertical-lr;
      letter-spacing: 4px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.1s ease, background-color 0.2s ease;
      border: none;
    }
    .btn-back-top:active {
      transform: scale(0.95);
      background-color: #9ea800;
    }

    /* 右側「餐食介紹」標題文字 */
    .header-title {
      font-size: 32px;
      font-weight: bold;
      color: #2b2b2b;
      letter-spacing: 2px;
    }

    /* -----------------------------------
       食材形狀網格區域 (依照草圖交錯佈局)
    ----------------------------------- */
    .food-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 35px;
      padding: 0 10px;
    }

    .food-row {
      width: 100%;
      display: flex;
      align-items: center;
    }

    .food-row.row-left {
      justify-content: flex-start;
      padding-left: 20px;
    }

    .food-row.row-right {
      justify-content: flex-end;
      padding-right: 20px;
    }

    .food-row.row-center {
      justify-content: center;
    }

    .food-item {
      max-width: 130px;
      height: auto;
      cursor: pointer;
      transition: transform 0.2s ease;
      display: block;
    }
    .food-item:active {
      transform: scale(0.92);
    }

    /* 關渡平原微型藝術祭 Banner */
    .guandu-banner {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 25px;
      display: block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      background-color: #f5f5f5;
      min-height: 120px;
    }

    /* 底部直排膠囊按鈕區 */
    .footer-nav {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .nav-pill {
      width: 100%;
      display: block;
      background-color: #b3c200;
      color: #ffffff;
      padding: 14px 0;
      border-radius: 30px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease, transform 0.1s ease;
      cursor: pointer;
      user-select: none;
      border: none;
    }
    .nav-pill:active {
      background-color: #9ea800;
      transform: scale(0.98);
    }

    /* 八仙六代園小視窗 (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 999;
      padding: 20px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: #0d6e5a;
      color: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      padding: 20px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .close-btn {
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      padding: 0 5px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .modal-media {
      width: 100%;
      height: 180px;
      position: relative;
      margin-bottom: 15px;
      border-radius: 10px;
      overflow: hidden;
      background-color: rgba(255,255,255,0.1);
    }
    .modal-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-desc {
      font-size: 13px;
      line-height: 1.6;
      color: #e2f3ee;
      margin-bottom: 15px;
      text-align: center;
    }

    .fb-btn {
      background-color: #ffffff;
      color: #0d6e5a;
      padding: 8px 30px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="page-container">
    
    <!-- 1. 頂部 Header -->
    <div class="header-section">
      <button class="btn-back-top" id="btn-top">回上面</button>
      <h1 class="header-title">餐食介紹</h1>
    </div>

    <!-- 2. 食材圖形區域 (精準對應排版圖) -->
    <div class="food-grid">
      
      <!-- 第一排：riceball1 (左上) 與 chicken (右上) -->
      <div class="food-row row-left">
        <img src="riceball1.png" alt="riceball1" class="food-item">
      </div>
      <div class="food-row row-right" style="margin-top: -40px;">
        <img src="chicken.png" alt="chicken" class="food-item">
      </div>

      <!-- 第二排：vege (中左) 與 riceball2 (中右) -->
      <div class="food-row row-left" style="margin-top: -10px; padding-left: 50px;">
        <img src="vege.png" alt="vege" class="food-item" style="max-width: 140px;">
      </div>
      <div class="food-row row-right" style="margin-top: -30px;">
        <!-- 點擊 riceball2 跳出八仙六代園小視窗 -->
        <img src="riceball2.png" alt="riceball2" class="food-item" id="riceball2-trigger">
      </div>

      <!-- 第三排：eggroll (下左) -->
      <div class="food-row row-left" style="margin-top: -20px;">
        <img src="eggroll.png" alt="eggroll" class="food-item" style="max-width: 150px;">
      </div>

      <!-- 第四排：cake (正下方置中) -->
      <div class="food-row row-center" style="margin-top: 10px;">
        <img src="cake.png" alt="cake" class="food-item" style="max-width: 160px;">
      </div>

    </div>

    <!-- 3. 關渡平原微型藝術祭 Banner -->
    <img src="guandu-banner.jpg" alt="關渡平原微型藝術祭" class="guandu-banner">

    <!-- 4. 底部直排膠囊按鈕區 -->
    <div class="footer-nav">
      <a href="#" class="nav-pill">在地合作介紹</a>
      <a href="#" class="nav-pill">講師 / 藝術家介紹</a>
      <a href="https://usrhub.tnua.edu.tw/elementor-6431/#" class="nav-pill">回上頁</a>
    </div>

  </div>

  <!-- 5. 深綠色八仙六代園小視窗 -->
  <div class="modal-overlay" id="farm-modal">
    <div class="modal-card">
      
      <div class="modal-header">
        <span class="close-btn" id="close-modal">✕</span>
        <span class="modal-title">八仙六代園</span>
        <span style="width:20px;"></span>
      </div>

      <div class="modal-media">
        <img src="baxian.jpg" alt="八仙六代園" class="modal-img">
      </div>

      <p class="modal-desc">
        以陽明山的水為灌溉命脈，延續古法用灼灼烈日作為穀物烘乾機，採取友善環境不施化肥的種植方式。
      </p>

      <a href="https://www.8gods.com.tw/zh-hant/categories/rice" target="_blank" class="fb-btn">
        FB / 官網
      </a>

    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // 頂部按鈕捲動到最上面
      var btnTop = document.getElementById('btn-top');
      if (btnTop) {
        btnTop.addEventListener('click', function() {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      // 點擊 riceball2 開啟八仙六代園小視窗
      var riceball2Trigger = document.getElementById('riceball2-trigger');
      var farmModal = document.getElementById('farm-modal');
      var closeModal = document.getElementById('close-modal');

      if (riceball2Trigger && farmModal) {
        riceball2Trigger.addEventListener('click', function() {
          farmModal.classList.add('active');
        });
      }

      if (closeModal && farmModal) {
        closeModal.addEventListener('click', function() {
          farmModal.classList.remove('active');
        });
      }

      if (farmModal) {
        farmModal.addEventListener('click', function(e) {
          if (e.target === farmModal) {
            farmModal.classList.remove('active');
          }
        });
      }
    });
  </script>

</body>
</html>
