<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餐食介紹 - 關渡共食</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-container {
      width: 100%;
      max-width: 450px;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頂部 Header */
    .header-section {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
      padding-left: 5px;
    }

    .btn-back-top {
      background-color: #b3c200;
      color: #ffffff;
      width: 65px;
      height: 120px;
      border-radius: 35px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 20px;
      writing-mode: vertical-lr;
      letter-spacing: 4px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.1s ease, background-color 0.2s ease;
      border: none;
      text-decoration: none;
      flex-shrink: 0;
    }
    .btn-back-top:active {
      transform: scale(0.95);
      background-color: #9ea800;
    }

    .header-title-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header-title {
      font-size: 32px;
      font-weight: bold;
      color: #2b2b2b;
      letter-spacing: 2px;
    }

    .header-subtitle {
      font-size: 13px;
      color: #888888;
      letter-spacing: 0.5px;
      user-select: none;
    }

    /* 食材圖形網格區域 */
    .food-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 35px;
      padding: 0 5px;
    }

    .food-row {
      width: 100%;
      display: flex;
      align-items: center;
    }

    .food-row.row-left {
      justify-content: flex-start;
      padding-left: 5px;
    }

    .food-row.row-right {
      justify-content: flex-end;
      padding-right: 5px;
    }

    .food-row.row-center {
      justify-content: center;
    }

    /* -----------------------------------
       食材 + 標籤組合通用樣式與漂浮
    ----------------------------------- */
    .food-group {
      display: flex;
      align-items: center;
      cursor: pointer;
      will-change: transform;
      animation: floatAnim 3s ease-in-out infinite alternate;
      transition: transform 0.15s ease-out;
    }

    .food-group:active {
      transform: scale(1.1) !important;
    }

    .labels-column {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .labels-right {
      margin-left: -8px;
    }

    .labels-left {
      margin-right: -8px;
    }

    .label-line-item {
      display: flex;
      align-items: center;
    }

    .pointer-line {
      width: 25px;
      height: 2px;
      display: inline-block;
      margin: 0 4px;
    }

    .food-label-text {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.5px;
      user-select: none;
      white-space: nowrap;
    }

    /* 各組色彩定義 */
    .color-riceball1 .pointer-line { background-color: #d3be6a; }
    .color-riceball1 .food-label-text { color: #d3be6a; }

    .color-chicken .pointer-line { background-color: #c56e3b; }
    .color-chicken .food-label-text { color: #c56e3b; }

    .color-vege .pointer-line { background-color: #8f9e1e; }
    .color-vege .food-label-text { color: #8f9e1e; }

    .color-riceball2 .pointer-line { background-color: #ba8ecf; }
    .color-riceball2 .food-label-text { color: #ba8ecf; }

    .color-eggroll .pointer-line { background-color: #f0b800; }
    .color-eggroll .food-label-text { color: #f0b800; }

    .color-cake .pointer-line { background-color: #f09bb0; }
    .color-cake .food-label-text { color: #f09bb0; }

    .food-item {
      max-width: 120px;
      height: auto;
      cursor: pointer;
      display: block;
    }

    @keyframes floatAnim {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }

    .delay-1 { animation-delay: 0s; }
    .delay-2 { animation-delay: 0.5s; }
    .delay-3 { animation-delay: 1.0s; }
    .delay-4 { animation-delay: 1.5s; }
    .delay-5 { animation-delay: 2.0s; }
    .delay-6 { animation-delay: 2.5s; }

    /* 關渡平原 Banner */
    .guandu-banner {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 25px;
      display: block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      background-color: #f5f5f5;
      min-height: 120px;
    }

    /* 底部橫向並排直立膠囊按鈕區 */
    .footer-nav-horizontal {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .nav-pill-vertical {
      flex: 1;
      height: 190px;
      background-color: #b3c200;
      color: #ffffff;
      border-radius: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 17px;
      writing-mode: vertical-lr;
      letter-spacing: 3px;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      transition: background-color 0.2s ease, transform 0.1s ease;
      cursor: pointer;
      user-select: none;
      border: none;
    }

    .nav-pill-vertical:active {
      background-color: #9ea800;
      transform: scale(0.95);
    }

    /* -----------------------------------
       通用彈跳視窗 (Modal)
    ----------------------------------- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 999;
      padding: 20px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: #0d6e5a;
      color: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      padding: 20px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .close-btn {
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      padding: 0 5px;
      line-height: 1;
    }

    .modal-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      text-align: center;
      flex-grow: 1;
    }

    .modal-media {
      width: 100%;
      height: 180px;
      position: relative;
      margin-bottom: 12px;
      border-radius: 12px;
      overflow: hidden;
      background-color: rgba(255,255,255,0.1);
    }
    .modal-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }
    .modal-img.active {
      opacity: 1;
    }

    .arrow-left, .arrow-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 22px;
      color: #ffffff;
      cursor: pointer;
      background: rgba(0,0,0,0.35);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      user-select: none;
    }
    .arrow-left { left: 8px; }
    .arrow-right { right: 8px; }

    /* 切換農場卡片的大白色箭頭 */
    .card-switch-arrow {
      position: absolute;
      top: 65%;
      transform: translateY(-50%);
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      z-index: 20;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .card-switch-arrow:active {
      background: rgba(255, 255, 255, 0.5);
      transform: translateY(-50%) scale(0.9);
    }
    .card-switch-arrow.left-arrow { left: -12px; }
    .card-switch-arrow.right-arrow { right: -12px; }

    /* 食材標籤提示列 */
    .ingredient-tag {
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ingredient-highlight {
      border: 2px solid #b3c200;
      color: #ffffff;
      padding: 2px 10px;
      border-radius: 8px;
      background-color: rgba(179, 194, 0, 0.2);
    }

    .modal-desc {
      font-size: 12.5px;
      line-height: 1.5;
      color: #e2f3ee;
      margin-bottom: 15px;
      text-align: left;
      min-height: 60px;
      padding: 0 5px;
    }

    .fb-btn {
      background-color: #ffffff;
      color: #0d6e5a;
      padding: 8px 30px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <div class="page-container">
    
    <!-- 1. 頂部 Header -->
    <div class="header-section">
      <a href="https://usrhub.tnua.edu.tw/elementor-6431/#" class="btn-back-top">回上面</a>

    </div>

    <!-- 2. 食材圖形區域 -->
    <div class="food-grid">

      <div class="food-row row-left">

      <div class="food-row row-right" style="margin-top: -20px;">

            <div class="label-line-item"><span class="food-label-text">八仙六代園</span><span class="pointer-line"></span></div>
            <div class="label-line-item"><span class="food-label-text">峰村有機農場</span><span class="pointer-line"></span></div>

            <div class="label-line-item"><span class="pointer-line"></span><span class="food-label-text">隨野家農場</span></div>

      <!-- cake (一德農園 ↔ 八仙六代園 ↔ 財福海芋田 ↔ 峰村有機農場) -->

        prefix: "甜點中的：",
        ingredient: "海芋 / 繡球花",
        desc: "位於陽明山竹子湖，耕耘優質海芋與繡球花卉，推廣休閒農業與四季花卉風貌，帶給民眾親近自然的溫暖體驗。",
        fb: "https://www.facebook.com/caifucalla",
        imgs: ["p1.JPG", "p2.jpg", "p3.JPG", "p4.JPG", "p5.jpg", "p6.jpeg", "p7.jpeg", "p8.jpg", "p9.jpg"]
      };

      // 各項料理觸發時的 Modal 組合
      var modalDataSets = {
        riceball1: [farm_baxian, farm_hushan],
        chicken: [farm_fengcun],
        vege: [farm_shanshui, farm_sunkitchen, farm_homeland, farm_yide],
        riceball2: [farm_sunkitchen, farm_baxian, farm_fengcun],
        eggroll: [farm_suiye],
        cake: [farm_yide, farm_baxian, farm_caifu, farm_fengcun]
      };

      var activeCardsData = [];
      var currentCardIdx = 0;
      var currentImgIdx = 0;
      var autoPlayTimer = null;

      var farmModal = document.getElementById('farm-modal');
      var closeModal = document.getElementById('close-modal');
      var cardTitle = document.getElementById('modal-card-title');
      var prefixText = document.getElementById('prefix-text');
      var ingredientText = document.getElementById('ingredient-text');
      var descText = document.getElementById('modal-desc-text');
      var fbLink = document.getElementById('modal-fb-link');
      var mediaContainer = document.getElementById('media-container');
      var cardPrevBtn = document.getElementById('card-prev');
      var cardNextBtn = document.getElementById('card-next');

      function loadCard(cardIdx) {
        currentCardIdx = cardIdx;
        currentImgIdx = 0;
        var data = activeCardsData[cardIdx];

        cardTitle.innerText = data.title;
        prefixText.innerText = data.prefix || "食材中的：";
        ingredientText.innerText = data.ingredient;
        descText.innerHTML = data.desc;
        fbLink.href = data.fb;

        // 切換卡片箭頭顯示
        if (activeCardsData.length > 1) {
          cardPrevBtn.style.display = 'flex';
          cardNextBtn.style.display = 'flex';
        } else {
          cardPrevBtn.style.display = 'none';
          cardNextBtn.style.display = 'none';
        }

        var oldImgs = mediaContainer.querySelectorAll('.modal-img');
        oldImgs.forEach(function(img) { img.remove(); });

        data.imgs.forEach(function(src, i) {
          var imgEl = document.createElement('img');
          imgEl.src = src;
          imgEl.className = 'modal-img' + (i === 0 ? ' active' : '');
          mediaContainer.appendChild(imgEl);
        });

        // 圖片輪播箭頭顯示
        var prevImgBtn = document.getElementById('prev-img');
        var nextImgBtn = document.getElementById('next-img');
        if (data.imgs.length <= 1) {
          prevImgBtn.style.display = 'none';
          nextImgBtn.style.display = 'none';
        } else {
          prevImgBtn.style.display = 'flex';
          nextImgBtn.style.display = 'flex';
        }
      }

      function showSlide(imgIdx) {
        var imgs = mediaContainer.querySelectorAll('.modal-img');
        imgs.forEach(function(img, i) {
          if (i === imgIdx) img.classList.add('active');
          else img.classList.remove('active');
        });
      }

      function startAutoPlay() {
        if (autoPlayTimer) clearInterval(autoPlayTimer);
        autoPlayTimer = setInterval(function() {
          var imgs = mediaContainer.querySelectorAll('.modal-img');
          if (imgs.length > 1) {
            currentImgIdx = (currentImgIdx + 1) % imgs.length;
            showSlide(currentImgIdx);
          }
        }, 3000);
      }

      function stopAutoPlay() {
        if (autoPlayTimer) clearInterval(autoPlayTimer);
      }

      var triggers = document.querySelectorAll('.trigger-farm-modal');
      triggers.forEach(function(trigger) {
        trigger.addEventListener('click', function() {
          var modalType = this.getAttribute('data-modal');
          if (modalDataSets[modalType]) {
            activeCardsData = modalDataSets[modalType];
            loadCard(0);
            farmModal.classList.add('active');
            startAutoPlay();
          }
        });
      });

      cardPrevBtn.addEventListener('click', function() {
        stopAutoPlay();
        currentCardIdx = (currentCardIdx - 1 + activeCardsData.length) % activeCardsData.length;
        loadCard(currentCardIdx);
        startAutoPlay();
      });

      cardNextBtn.addEventListener('click', function() {
        stopAutoPlay();
        currentCardIdx = (currentCardIdx + 1) % activeCardsData.length;
        loadCard(currentCardIdx);
        startAutoPlay();
      });

      document.getElementById('next-img').addEventListener('click', function() {
        stopAutoPlay();
        var imgs = mediaContainer.querySelectorAll('.modal-img');
        if (imgs.length > 1) {
          currentImgIdx = (currentImgIdx + 1) % imgs.length;
          showSlide(currentImgIdx);
          startAutoPlay();
        }
      });

      document.getElementById('prev-img').addEventListener('click', function() {
        stopAutoPlay();
        var imgs = mediaContainer.querySelectorAll('.modal-img');
        if (imgs.length > 1) {
          currentImgIdx = (currentImgIdx - 1 + imgs.length) % imgs.length;
          showSlide(currentImgIdx);
          startAutoPlay();
        }
      });

      if (closeModal && farmModal) {
        closeModal.addEventListener('click', function() {
          farmModal.classList.remove('active');
          stopAutoPlay();
        });
      }

      if (farmModal) {
        farmModal.addEventListener('click', function(e) {
          if (e.target === farmModal) {
            farmModal.classList.remove('active');
            stopAutoPlay();
          }
        });
      }
    });
  </script>

</body>
</html>
