<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餐食介紹 - 關渡共食</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-container {
      width: 100%;
      max-width: 450px;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頂部 Header */
    .header-section {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 25px;
      margin-bottom: 25px;
      padding-left: 10px;
    }

    .btn-back-top {
      background-color: #b3c200;
      color: #ffffff;
      width: 65px;
      height: 120px;
      border-radius: 35px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 20px;
      writing-mode: vertical-lr;
      letter-spacing: 4px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.1s ease, background-color 0.2s ease;
      border: none;
    }
    .btn-back-top:active {
      transform: scale(0.95);
      background-color: #9ea800;
    }

    .header-title {
      font-size: 32px;
      font-weight: bold;
      color: #2b2b2b;
      letter-spacing: 2px;
    }

    /* 食材圖形網格區域 */
    .food-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 35px;
      padding: 0 10px;
    }

    .food-row {
      width: 100%;
      display: flex;
      align-items: center;
    }

    .food-row.row-left {
      justify-content: flex-start;
      padding-left: 20px;
    }

    .food-row.row-right {
      justify-content: flex-end;
      padding-right: 20px;
    }

    .food-row.row-center {
      justify-content: center;
    }

    /* 漂浮與點擊放大效果 */
    .food-item {
      max-width: 130px;
      height: auto;
      cursor: pointer;
      display: block;
      will-change: transform;
      animation: floatAnim 3s ease-in-out infinite alternate;
      transition: transform 0.15s ease-out;
    }

    .food-item:active {
      transform: scale(1.18) !important;
    }

    @keyframes floatAnim {
      0% {
        transform: translateY(0px);
      }
      100% {
        transform: translateY(-12px);
      }
    }

    .delay-1 { animation-delay: 0s; }
    .delay-2 { animation-delay: 0.5s; }
    .delay-3 { animation-delay: 1.0s; }
    .delay-4 { animation-delay: 1.5s; }
    .delay-5 { animation-delay: 2.0s; }
    .delay-6 { animation-delay: 2.5s; }

    /* 關渡平原 Banner */
    .guandu-banner {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 25px;
      display: block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      background-color: #f5f5f5;
      min-height: 120px;
    }

    /* 底部直排膠囊按鈕區 */
    .footer-nav {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .nav-pill {
      width: 100%;
      display: block;
      background-color: #b3c200;
      color: #ffffff;
      padding: 14px 0;
      border-radius: 30px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease, transform 0.1s ease;
      cursor: pointer;
      user-select: none;
      border: none;
    }
    .nav-pill:active {
      background-color: #9ea800;
      transform: scale(0.98);
    }

    /* 八仙六代園小視窗 (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 999;
      padding: 20px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: #0d6e5a;
      color: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      padding: 20px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .close-btn {
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      padding: 0 5px;
      line-height: 1;
    }
    .modal-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .modal-media {
      width: 100%;
      height: 190px;
      position: relative;
      margin-bottom: 15px;
      border-radius: 12px;
      overflow: hidden;
      background-color: rgba(255,255,255,0.1);
    }
    .modal-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }
    .modal-img.active {
      opacity: 1;
    }

    .arrow-left, .arrow-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 22px;
      color: #ffffff;
      cursor: pointer;
      background: rgba(0,0,0,0.35);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      user-select: none;
    }
    .arrow-left { left: 8px; }
    .arrow-right { right: 8px; }

    .modal-desc {
      font-size: 13px;
      line-height: 1.6;
      color: #e2f3ee;
      margin-bottom: 15px;
      text-align: center;
    }

    .fb-btn {
      background-color: #ffffff;
      color: #0d6e5a;
      padding: 8px 30px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <div class="page-container">
    
    <!-- 1. 頂部 Header -->
    <div class="header-section">
      <button class="btn-back-top" id="btn-top">回上面</button>
      <h1 class="header-title">餐食介紹</h1>
    </div>

    <!-- 2. 食材圖形區域 -->
    <div class="food-grid">
      
      <div class="food-row row-left">
        <img src="riceball1.png" alt="riceball1" class="food-item delay-1 trigger-farm-modal">
      </div>
      <div class="food-row row-right" style="margin-top: -40px;">

      </div>

      <div class="food-row row-left" style="margin-top: -10px; padding-left: 50px;">
        <img src="vege.png" alt="vege" class="food-item delay-3" style="max-width: 140px;">
      </div>
      <div class="food-row row-right" style="margin-top: -30px;">
        <img src="riceball2.
