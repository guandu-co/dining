<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餐食介紹 - 關渡共食</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頁面整體容器 */
    .page-container {
      width: 100%;
      max-width: 450px;
      padding: 20px 15px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 上方「回上面 / 餐食介紹」標頭 */
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .back-top-pill {
      background-color: #afc136;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }
    .page-title {
      font-size: 22px;
      font-weight: bold;
      color: #333333;
      letter-spacing: 2px;
    }

    /* 幾何食材區域 */
    .shapes-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      margin-bottom: 40px;
    }
    .shape-item {
      cursor: pointer;
      transition: transform 0.2s ease;
      max-width: 80%;
      height: auto;
    }
    .shape-item:active {
      transform: scale(0.95);
    }

    /* 關渡平原藝術祭 Banner */
    .guandu-banner {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 25px;
      display: block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      background-color: #f0f0f0;
      min-height: 120px;
    }

    /* 底部直排膠囊按鈕區 */
    .footer-nav {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
    }
    .nav-pill {
      width: 100%;
      background-color: #afc136;
      color: #ffffff;
      padding: 14px 0;
      border-radius: 30px;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: background-color 0.2s ease;
      cursor: pointer;
      user-select: none;
    }
    .nav-pill:active {
      background-color: #9ab027;
    }

    /* -----------------------------------
       深綠色八仙六代園小視窗 (Modal)
    ----------------------------------- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 999;
      padding: 20px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: #0d6e5a;
      color: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      padding: 20px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .close-btn {
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      padding: 0 5px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* 小視窗圖片區域 */
    .modal-media {
      width: 100%;
      height: 180px;
      position: relative;
      margin-bottom: 15px;
      border-radius: 10px;
      overflow: hidden;
      background-color: rgba(255,255,255,0.1);
    }
    .modal-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }
    .modal-img.active {
      opacity: 1;
    }

    .arrow-left, .arrow-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      color: #ffffff;
      cursor: pointer;
      background: rgba(0,0,0,0.3);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      user-select: none;
    }
    .arrow-left { left: 8px; }
    .arrow-right { right: 8px; }

    .modal-desc {
      font-size: 13px;
      line-height: 1.6;
      color: #e2f3ee;
      margin-bottom: 15px;
      text-align: center;
    }

    .fb-btn {
      background-color: #ffffff;
      color: #0d6e5a;
      padding: 8px 30px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="page-container">
    
    <!-- 1. 上方 Header -->
    <div class="header">
      <div class="back-top-pill" onclick="history.back()">回上面</div>
      <div class="page-title">餐食介紹</div>
    </div>

    <!-- 2. 幾何食材區域 -->
    <div class="shapes-container">
      <img src="未命名的作品 26.png" alt="三角飯糰" class="shape-item" id="rice-ball-shape">
    </div>

    <!-- 3. 按鈕正上方的「關渡平原微型藝術祭」 Banner 圖片 -->
    <img src="關渡平原banner.jpg" alt="關渡平原微型藝術祭" class="guandu-banner">

    <!-- 4. 底部直排按鈕區 -->
    <div class="footer-nav">
      <a href="#" class="nav-pill">在地合作介紹</a>
      <a href="#" class="nav-pill">講師 / 藝術家介紹</a>
      <div class="nav-pill" onclick="history.back()">回上頁</div>
    </div>

  </div>

  <!-- 5. 深綠色八仙六代園小視窗 -->
  <div class="modal-overlay" id="farm-modal">
    <div class="modal-card">
      
      <div class="modal-header">
        <span class="close-btn" id="close-modal">✕</span>
        <span class="modal-title">八仙六代園</span>
        <span style="width:20px;"></span>
      </div>

      <!-- 自動輪播圖片區域 -->
      <div class="modal-media">
        <span class="arrow-left" id="prev-img">‹</span>
        <img src="米.jpg" alt="八仙六代園 米" class="modal-img active">
        <img src="八仙.jpg" alt="八仙六代園" class="modal-img">
        <span class="arrow-right" id="next-img">›</span>
      </div>

      <p class="modal-desc">
        以陽明山的水為灌溉命脈，延續古法用灼灼烈日作為穀物烘乾機，採取友善環境不施化肥的種植方式。
      </p>

      <a href="https://www.8gods.com.tw/zh-hant/categories/rice" target="_blank" class="fb-btn">
        FB / 官網
      </a>

    </div>
  </div>

  <script>
    const riceBallShape = document.getElementById('rice-ball-shape');
    const farmModal = document.getElementById('farm-modal');
    const closeModal = document.getElementById('close-modal');

    // 小視窗自動輪播邏輯
    const modalImgs = document.querySelectorAll('.modal-img');
    let currentModalIdx = 0;
    let autoPlayInterval = null;

    function showModalImg(index) {
      modalImgs.forEach((img, i) => {
        img.classList.toggle('active', i === index);
      });
    }

    function startAutoPlay() {
      if (autoPlayInterval) clearInterval(autoPlayInterval);
      autoPlayInterval = setInterval(() => {
        currentModalIdx = (currentModalIdx + 1) % modalImgs.length;
        showModalImg(currentModalIdx);
      }, 3000);
    }

    function stopAutoPlay() {
      if (autoPlayInterval) clearInterval(autoPlayInterval);
    }

    if (riceBallShape) {
      riceBallShape.addEventListener('click', () => {
        farmModal.classList.add('active');
        startAutoPlay();
      });
    }

    if (closeModal) {
      closeModal.addEventListener('click', () => {
        farmModal.classList.remove('active');
        stopAutoPlay();
      });
    }

    if (farmModal) {
      farmModal.addEventListener('click', (e) => {
        if (e.target === farmModal) {
          farmModal.classList.remove('active');
          stopAutoPlay();
        }
      });
    }

    const nextBtn = document.getElementById('next-img');
    const prevBtn = document.getElementById('prev-img');

    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        stopAutoPlay();
        currentModalIdx = (currentModalIdx + 1) % modalImgs.length;
        showModalImg(currentModalIdx);
        startAutoPlay();
      });
