<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>關渡共食餐盒</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .hero-container {
      width: 90%;
      max-width: 450px;
      text-align: center;
      position: relative;
      cursor: pointer;
    }
    .hero-container img {
      width: 100%;
      height auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .hint-text {
      margin-top: 15px;
      font-size: 14px;
      color: #bbbbbb;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="hero-container" id="bento-box">
    <img id="main-img" src="3.gif" alt="關渡共食餐盒">
    <p class="hint-text" id="hint">👆 點擊餐盒開吃！</p>
  </div>

  <script>
    const bentoBox = document.getElementById('bento-box');
    const mainImg = document.getElementById('main-img');
    const hint = document.getElementById('hint');

    let currentState = 0;

    bentoBox.addEventListener('click', (e) => {
      // 第一次點擊：GIF -> 不動.png
      if (currentState === 0) {
        mainImg.src = '不動.png';
        hint.innerText = '👆 點擊「紫蘇飯糰」查看食材資訊！';
        currentState = 1;
        return;
      }

      // 取得點擊位置
      const rect = mainImg.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) / rect.width;
      const clickY = (e.clientY - rect.top) / rect.height;

      // 如果已經在「飯糰亮起」狀態，再次點擊右上飯糰區塊 -> 跳轉到 rice-ball.html 新頁面
      if (currentState === 2 && clickX > 0.4 && clickY <= 0.6) {
        window.location.href = 'rice-ball.html';
        return;
      }

      // 點擊右上角 (飯糰)
      if (clickX > 0.4 && clickY <= 0.6) {
        mainImg.src = '飯糰.png';
        hint.innerText = '👉 再次點擊飯糰，前往農家介紹頁面 ➔';
        currentState = 2;
      } 
      // 點擊右下角 (玉子燒)
      else if (clickX > 0.4 && clickY > 0.6) {
        mainImg.src = '玉子燒亮.png';
        hint.innerText = '🍳 玉子燒：選用優質放牧雞蛋';
        currentState = 3;
      } 
      // 點擊其他空白處
      else {
        mainImg.src = '不動.png';
        hint.innerText = '👆 點擊菜色查看農家資訊';
        currentState = 1;
      }
    });
  </script>

</body>
</html>
