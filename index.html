<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餐食介紹 - 關渡共食</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-container {
      width: 100%;
      max-width: 450px;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頂部 Header */
    .header-section {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
      padding-left: 5px;
    }

    .btn-back-top {
      background-color: #b3c200;
      color: #ffffff;
      width: 65px;
      height: 120px;
      border-radius: 35px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 20px;
      writing-mode: vertical-lr;
      letter-spacing: 4px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.1s ease, background-color 0.2s ease;
      border: none;
      text-decoration: none;
      flex-shrink: 0;
      z-index: 10;
    }
    .btn-back-top:active {
      transform: scale(0.95);
      background-color: #9ea800;
    }

    .header-title-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header-title {
      font-size: 32px;
      font-weight: bold;
      color: #2b2b2b;
      letter-spacing: 2px;
    }

    .header-subtitle {
      font-size: 13px;
      color: #888888;
      letter-spacing: 0.5px;
      user-select: none;
    }

    /* 食材圖形網格區域 */
    .food-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 40px;
      margin-bottom: 45px;
      padding: 0 5px;
    }

    .food-row {
      width: 100%;
      display: flex;
      align-items: center;
    }

    .food-row.row-left {
      justify-content: flex-start;
      padding-left: 5px;
    }

    .food-row.row-right {
      justify-content: flex-end;
      padding-right: 5px;
    }

    .food-row.row-center {
      justify-content: center;
    }

    /* -----------------------------------
       食材 + 標籤組合通用樣式與漂浮
    ----------------------------------- */
    .food-group {
      display: flex;
      align-items: center;
      cursor: pointer;
      will-change: transform;
      animation: floatAnim 3s ease-in-out infinite alternate;
      transition: transform 0.15s ease-out;
      position: relative;
      z-index: 5;
    }

    .food-group:active {
      transform: scale(1.08) !important;
    }

    .labels-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .labels-right {
      margin-left: -10px;
    }

    .labels-left {
      margin-right: -10px;
    }

    .label-line-item {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    /* 卷卷.png 連接線 */
    .curly-png-line {
      width: 96px;
      height: 60px;
      display: inline-block;
      margin: 0 2px;
      flex-shrink: 0;
      pointer-events: none;
      -webkit-mask-image: url('卷卷.png');
      mask-image: url('卷卷.png');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
    }

    .food-label-text {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.5px;
      user-select: none;
      white-space: nowrap;
    }

    /* 各組色彩定義 (文字與 卷卷.png 連接線顏色) */
    .color-riceball1 .food-label-text { color: #d3be6a; }
    .color-riceball1 .curly-png-line { background-color: #d3be6a; }

    .color-chicken .food-label-text { color: #c56e3b; }
    .color-chicken .curly-png-line { background-color: #c56e3b; }

    .color-vege .food-label-text { color: #8f9e1e; }
    .color-vege .curly-png-line { background-color: #8f9e1e; }

    .color-riceball2 .food-label-text { color: #ba8ecf; }
    .color-riceball2 .curly-png-line { background-color: #ba8ecf; }

    .color-eggroll .food-label-text { color: #f0b800; }
    .color-eggroll .curly-png-line { background-color: #f0b800; }

    .color-cake .food-label-text { color: #f09bb0; }
    .color-cake .curly-png-line { background-color: #f09bb0; }

    .food-item {
      max-width: 120px;
      height: auto;
      cursor: pointer;
      display: block;
    }

    @keyframes floatAnim {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }

    .delay-1 { animation-delay: 0s; }
    .delay-2 { animation-delay: 0.5s; }
    .delay-3 { animation-delay: 1.0s; }
    .delay-4 { animation-delay: 1.5s; }
    .delay-5 { animation-delay: 2.0s; }
    .delay-6 { animation-delay: 2.5s; }

    /* -----------------------------------
       底部 Banner 輪播區域
    ----------------------------------- */
    .banner-slider-container {
      width: 100%;
      position: relative;
      border-radius: 12px;
      margin-bottom: 25px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      background-color: #f5f5f5;
      display: block;
    }

    .banner-placeholder {
      width: 100%;
      height: auto;
      display: block;
      visibility: hidden;
    }

    .banner-slide-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .banner-slide-img.active {
      opacity: 1;
    }

    /* 底部橫向並排直立膠囊按鈕區 */
    .footer-nav-horizontal {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .nav-pill-vertical {
      flex: 1;
      height: 190px;
      background-color: #b3c200;
      color: #ffffff;
      border-radius: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 17px;
      writing-mode: vertical-lr;
      letter-spacing: 3px;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      transition: background-color 0.2s ease, transform 0.1s ease;
      cursor: pointer;
      user-select: none;
      border: none;
    }

    .nav-pill-vertical:active {
      background-color: #9ea800;
      transform: scale(0.95);
    }

    /* -----------------------------------
       通用彈跳視窗 (Modal)
    ----------------------------------- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 999;
      padding: 20px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: #0d6e5a;
      color: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      padding: 20px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .close-btn {
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      padding: 0 5px;
      line-height: 1;
    }

    .modal-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      text-align: center;
      flex-grow: 1;
    }

    .modal-media {
      width: 100%;
      height: 180px;
      position: relative;
      margin-bottom: 12px;
      border-radius: 12px;
      overflow: hidden;
      background-color: rgba(255,255,255,0.1);
    }
    .modal-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }
    .modal-img.active {
      opacity: 1;
    }

    /* 圖片特殊微調 Class */
    .modal-img.rotate-90 {
      transform: rotate(90deg) scale(1.35);
    }

    /* 照片輪播箭頭（無圓圈底色，僅保留符號筆畫） */
    .arrow-left, .arrow-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 32px;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
      background: none;
      width: auto;
      height: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      user-select: none;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    .arrow-left { left: 10px; }
    .arrow-right { right: 10px; }

    /* 切換農場卡片的大白色箭頭（精準與使用食材框水平對齊並靠近） */
    .card-switch-arrow {
      position: absolute;
      bottom: 122px; /* 對齊 ingredient-tag 的水平高度 */
      font-size: 38px;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      z-index: 30;
      background: none;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.1s ease;
      text-shadow: 0 2px 6px rgba(0,0,0,0.4);
      line-height: 1;
    }
    .card-switch-arrow:active {
      transform: scale(0.85);
    }
    .card-switch-arrow.left-arrow { left: 8px; }
    .card-switch-arrow.right-arrow { right: 8px; }

    /* 食材標籤提示列（獨立呈現） */
    .ingredient-tag {
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
      position: relative;
    }
    .ingredient-highlight {
      border: 2px solid #b3c200;
      color: #ffffff;
      padding: 3px 12px;
      border-radius: 8px;
      background-color: rgba(179, 194, 0, 0.2);
      display: inline-block;
    }

    /* 所有介紹文字全數置中排列 */
    .modal-desc {
      font-size: 12.5px;
      line-height: 1.5;
      color: #e2f3ee;
      margin-bottom: 15px;
      text-align: center;
      min-height: 60px;
      padding: 0 5px;
    }

    .fb-btn {
      background-color: #ffffff;
      color: #0d6e5a;
      padding: 8px 30px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="page-container">
    
    <!-- 1. 頂部 Header -->
    <div class="header-section">
      <a href="https://usrhub.tnua.edu.tw/elementor-6431/#" class="btn-back-top">回上面</a>
      <div class="header-title-container">
        <h1 class="header-title">餐食介紹</h1>
        <p class="header-subtitle">點擊料理查看辛苦的農民們吧！</p>
      </div>
    </div>

    <!-- 2. 食材圖形區域 -->
    <div class="food-grid">
      
      <!-- 第一排：riceball1 (按筆劃排序：八仙六代園 ➔ 四口田 ➔ 足妹農場 ➔ 林記醬油 ➔ 湖山社區發展協會) -->
      <div class="food-row row-left">
        <div class="food-group color-riceball1 delay-1 trigger-farm-modal" data-modal="riceball1">
          <img src="riceball1.png" alt="riceball1" class="food-item">
          <div class="labels-column labels-right">
            <div class="label-line-item" data-farm-target="八仙六代園"><span class="curly-png-line"></span><span class="food-label-text">八仙六代園</span></div>
            <div class="label-line-item" data-farm-target="四口田"><span class="curly-png-line"></span><span class="food-label-text">四口田</span></div>
            <div class="label-line-item" data-farm-target="足妹農場"><span class="curly-png-line"></span><span class="food-label-text">足妹農場</span></div>
            <div class="label-line-item" data-farm-target="林記醬油"><span class="curly-png-line"></span><span class="food-label-text">林記醬油</span></div>
            <div class="label-line-item" data-farm-target="湖山社區發展協會"><span class="curly-png-line"></span><span class="food-label-text">湖山社區發展協會</span></div>
          </div>
        </div>
      </div>

      <!-- chicken (峰村有機農場) -->
      <div class="food-row row-right">
        <div class="food-group color-chicken delay-2 trigger-farm-modal" data-modal="chicken">
          <div class="labels-column labels-left">
            <div class="label-line-item" data-farm-target="峰村有機農場">
              <span class="food-label-text">峰村有機農場</span>
              <span class="curly-png-line"></span>
            </div>
          </div>
          <img src="chicken.png" alt="chicken" class="food-item">
        </div>
      </div>

      <!-- vege (按筆劃排序：一德農園 ➔ 故鄉金針花農園 ➔ 曹永慶 ➔ 財福海芋田 ➔ 峰村有機農場 ➔ 湖山社區發展協會 ➔ 足妹農場) -->
      <div class="food-row row-left">
        <div class="food-group color-vege delay-3 trigger-farm-modal" data-modal="vege">
          <img src="vege.png" alt="vege" class="food-item" style="max-width: 125px;">
          <div class="labels-column labels-right">
            <div class="label-line-item" data-farm-target="一德農園"><span class="curly-png-line"></span><span class="food-label-text">一德農園</span></div>
            <div class="label-line-item" data-farm-target="故鄉金針花農園"><span class="curly-png-line"></span><span class="food-label-text">故鄉金針花農園</span></div>
            <div class="label-line-item" data-farm-target="曹永慶"><span class="curly-png-line"></span><span class="food-label-text">曹永慶</span></div>
            <div class="label-line-item" data-farm-target="財福海芋田"><span class="curly-png-line"></span><span class="food-label-text">財福海芋田</span></div>
            <div class="label-line-item" data-farm-target="峰村有機農場"><span class="curly-png-line"></span><span class="food-label-text">峰村有機農場</span></div>
            <div class="label-line-item" data-farm-target="湖山社區發展協會"><span class="curly-png-line"></span><span class="food-label-text">湖山社區發展協會</span></div>
            <div class="label-line-item" data-farm-target="足妹農場"><span class="curly-png-line"></span><span class="food-label-text">足妹農場</span></div>
          </div>
        </div>
      </div>

      <!-- riceball2 (按筆劃排序：八仙六代園 ➔ 四口田) -->
      <div class="food-row row-right">
        <div class="food-group color-riceball2 delay-4 trigger-farm-modal" data-modal="riceball2">
          <div class="labels-column labels-left">
            <div class="label-line-item" data-farm-target="八仙六代園"><span class="food-label-text">八仙六代園</span><span class="curly-png-line"></span></div>
            <div class="label-line-item" data-farm-target="四口田"><span class="food-label-text">四口田</span><span class="curly-png-line"></span></div>
          </div>
          <img src="riceball2.png" alt="riceball2" class="food-item">
        </div>
      </div>

      <!-- eggroll (按筆劃排序：足妹農場 ➔ 隨野家農場) -->
      <div class="food-row row-left">
        <div class="food-group color-eggroll delay-5 trigger-farm-modal" data-modal="eggroll">
          <img src="eggroll.png" alt="eggroll" class="food-item" style="max-width: 130px;">
          <div class="labels-column labels-right">
            <div class="label-line-item" data-farm-target="足妹農場"><span class="curly-png-line"></span><span class="food-label-text">足妹農場</span></div>
            <div class="label-line-item" data-farm-target="隨野家農場"><span class="curly-png-line"></span><span class="food-label-text">隨野家農場</span></div>
          </div>
        </div>
      </div>

      <!-- cake (按筆劃排序：一德農園 ➔ 八仙六代園 ➔ 財福海芋田 ➔ 峰村有機農場) -->
      <div class="food-row row-center">
        <div class="food-group color-cake delay-6 trigger-farm-modal" data-modal="cake">
          <div class="labels-column labels-left">
            <div class="label-line-item" data-farm-target="一德農園"><span class="food-label-text">一德農園</span><span class="curly-png-line"></span></div>
            <div class="label-line-item" data-farm-target="八仙六代園"><span class="food-label-text">八仙六代園</span><span class="curly-png-line"></span></div>
            <div class="label-line-item" data-farm-target="財福海芋田"><span class="food-label-text">財福海芋田</span><span class="curly-png-line"></span></div>
            <div class="label-line-item" data-farm-target="峰村有機農場"><span class="food-label-text">峰村有機農場</span><span class="curly-png-line"></span></div>
          </div>
          <img src="cake.png" alt="cake" class="food-item" style="max-width: 135px;">
        </div>
      </div>

    </div>

    <!-- 3. 底部 Banner 區域 -->
    <div class="banner-slider-container" id="banner-slider">
      <img src="guandu-banner.jpg" class="banner-placeholder" alt="banner placeholder">
      <img src="banner3.png" alt="關渡共食" class="banner-slide-img active" onerror="if(this.src.endsWith('.png')){this.src='banner3.jpg';}else if(this.src.endsWith('.jpg')){this.src='banner3.jpeg';}">
      <img src="guandu-banner.jpg" alt="關渡平原微型藝術祭" class="banner-slide-img">
    </div>

    <!-- 4. 底部三個豎長型直排膠囊按鈕 -->
    <div class="footer-nav-horizontal">
      <a href="#" class="nav-pill-vertical">在地合作介紹</a>
      <a href="#" class="nav-pill-vertical">講師/藝術家介紹</a>
      <a href="https://usrhub.tnua.edu.tw/elementor-6431/#" class="nav-pill-vertical">回上頁</a>
    </div>

  </div>

  <!-- 5. 通用彈跳視窗 -->
  <div class="modal-overlay" id="farm-modal">
    <div class="modal-card">
      
      <span class="card-switch-arrow left-arrow" id="card-prev">‹</span>
      <span class="card-switch-arrow right-arrow" id="card-next">›</span>

      <div class="modal-header">
        <span class="close-btn" id="close-modal">✕</span>
        <span class="modal-title" id="modal-card-title">八仙六代園</span>
        <span style="width:20px;"></span>
      </div>

      <div class="modal-media" id="media-container">
        <span class="arrow-left" id="prev-img">‹</span>
        <span class="arrow-right" id="next-img">›</span>
      </div>

      <div class="ingredient-tag">
        <span id="prefix-text">珠蔥豆乳小魚乾日式飯糰中的：</span>
        <span class="ingredient-highlight" id="ingredient-text">米</span>
      </div>

      <p class="modal-desc" id="modal-desc-text"></p>

      <a href="#" target="_blank" class="fb-btn" id="modal-fb-link">
        FB
      </a>

    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // -----------------------------------
      // 1. 最下方 Banner 自動淡入淡出輪播
      // -----------------------------------
      var bannerContainer = document.getElementById('banner-slider');
      if (bannerContainer) {
        var bannerImgs = bannerContainer.querySelectorAll('.banner-slide-img');
        var currentBannerIdx = 0;
        setInterval(function() {
          if (bannerImgs.length > 1) {
            bannerImgs[currentBannerIdx].classList.remove('active');
            currentBannerIdx = (currentBannerIdx + 1) % bannerImgs.length;
            bannerImgs[currentBannerIdx].classList.add('active');
          }
        }, 3500);
      }

      // -----------------------------------
      // 2. 農家基礎介紹內文 (共通底稿)
      // -----------------------------------
      var desc_baxian = "農家第六代---宣智與亦真堅持友善耕作與自然共生，致力為下一代留下無毒乾淨的土地。<br><br>農場積極推動食農教育與季節農事體驗，包含插秧、割稻及米食 DIY、稻田運動會。邀請民眾在金黃稻浪間親近土地，感受都市角落裡最真誠的農村風土。";

      var activeCardsData = [];
      var currentCardIdx = 0;
      var currentImgIdx = 0;
      var autoPlayTimer = null;

      var farmModal = document.getElementById('farm-modal');
      var closeModal = document.getElementById('close-modal');
      var cardTitle = document.getElementById('modal-card-title');
      var prefixText = document.getElementById('prefix-text');
      var ingredientText = document.getElementById('ingredient-text');
      var descText = document.getElementById('modal-desc-text');
      var fbLink = document.getElementById('modal-fb-link');
      var mediaContainer = document.getElementById('media-container');
      var cardPrevBtn = document.getElementById('card-prev');
      var cardNextBtn = document.getElementById('card-next');

      function loadCard(cardIdx) {
        currentCardIdx = cardIdx;
        currentImgIdx = 0;
        var data = activeCardsData[cardIdx];

        cardTitle.innerText = data.title;
        prefixText.innerText = data.prefix || "食材中的：";
        ingredientText.innerText = data.ingredient;
        descText.innerHTML = data.desc;
        
        fbLink.innerText = data.btnText || "FB";
        fbLink.href = data.fb || "#";

        if (activeCardsData.length > 1) {
          cardPrevBtn.style.display = 'flex';
          cardNextBtn.style.display = 'flex';
        } else {
          cardPrevBtn.style.display = 'none';
          cardNextBtn.style.display = 'none';
        }

        var oldImgs = mediaContainer.querySelectorAll('.modal-img');
        oldImgs.forEach(function(img) { img.remove(); });

        data.imgs.forEach(function(item, i) {
          var imgSrc = (typeof item === 'string') ? item : item.src;
          var isRotate = (typeof item === 'object' && item.rotate);

          var imgEl = document.createElement('img');
          imgEl.src = imgSrc;
          imgEl.className = 'modal-img' + 
            (i === 0 ? ' active' : '') + 
            (isRotate ? ' rotate-90' : '');
            
          mediaContainer.appendChild(imgEl);
        });

        var prevImgBtn = document.getElementById('prev-img');
        var nextImgBtn = document.getElementById('next-img');
        if (data.imgs.length <= 1) {
          prevImgBtn.style.display = 'none';
          nextImgBtn.style.display = 'none';
        } else {
          prevImgBtn.style.display = 'flex';
          nextImgBtn.style.display = 'flex';
        }
      }

      function showSlide(imgIdx) {
        var imgs = mediaContainer.querySelectorAll('.modal-img');
        imgs.forEach(function(img, i) {
          if (i === imgIdx) img.classList.add('active');
          else img.classList.remove('active');
        });
      }

      function startAutoPlay() {
        if (autoPlayTimer) clearInterval(autoPlayTimer);
        autoPlayTimer = setInterval(function() {
          var imgs = mediaContainer.querySelectorAll('.modal-img');
          if (imgs.length > 1) {
            currentImgIdx = (currentImgIdx + 1) % imgs.length;
            showSlide(currentImgIdx);
          }
        }, 3000);
      }

      function stopAutoPlay() {
        if (autoPlayTimer) clearInterval(autoPlayTimer);
      }

      // 動態點擊監聽：點到哪個農家就開啟並跳至該農家卡片
      var foodGroups = document.querySelectorAll('.food-group');
      foodGroups.forEach(function(group) {
        group.addEventListener('click', function(e) {
          var modalType = this.getAttribute('data-modal');
          if (!modalDataSets[modalType]) return;

          activeCardsData = modalDataSets[modalType];
          var targetIdx = 0;

          // 判斷是否精準點擊到特定農家標籤
          var clickedLabel = e.target.closest('.label-line-item');
          if (clickedLabel) {
            var targetFarmName = clickedLabel.getAttribute('data-farm-target');
            var foundIdx = activeCardsData.findIndex(function(item) {
              return item.title === targetFarmName;
            });
            if (foundIdx !== -1) {
              targetIdx = foundIdx;
            }
          }

          loadCard(targetIdx);
          farmModal.classList.add('active');
          startAutoPlay();
        });
      });

      cardPrevBtn.addEventListener('click', function() {
        stopAutoPlay();
        currentCardIdx = (currentCardIdx - 1 + activeCardsData.length) % activeCardsData.length;
        loadCard(currentCardIdx);
        startAutoPlay();
      });

      cardNextBtn.addEventListener('click', function() {
        stopAutoPlay();
        currentCardIdx = (currentCardIdx + 1) % activeCardsData.length;
        loadCard(currentCardIdx);
        startAutoPlay();
      });

      document.getElementById('next-img').addEventListener('click', function() {
        stopAutoPlay();
        var imgs = mediaContainer.querySelectorAll('.modal-img');
        if (imgs.length > 1) {
          currentImgIdx = (currentImgIdx + 1) % imgs.length;
          showSlide(currentImgIdx);
          startAutoPlay();
        }
      });

      document.getElementById('prev-img').addEventListener('click', function() {
        stopAutoPlay();
        var imgs = mediaContainer.querySelectorAll('.modal-img');
        if (imgs.length > 1) {
          currentImgIdx = (currentImgIdx - 1 + imgs.length) % imgs.length;
          showSlide(currentImgIdx);
          startAutoPlay();
        }
      });

      if (closeModal && farmModal) {
        closeModal.addEventListener('click', function() {
          farmModal.classList.remove('active');
          stopAutoPlay();
        });
      }

      if (farmModal) {
        farmModal.addEventListener('click', function(e) {
          if (e.target === farmModal) {
            farmModal.classList.remove('active');
            stopAutoPlay();
          }
        });
      }
    });
